{% extends "base.html" %}

{% block content %}
<div class="detail-section">
    <h2 style="color: #b1e6e6; margin-top: 0;">Skapa ny auktion</h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <label for="title"><strong>Titel:</strong></label><br>
            <input name="title" id="title" placeholder="T.ex. iPhone 13 Pro" required style="width: 100%;">
        </div>

        <div>
            <label for="description"><strong>Beskrivning:</strong></label><br>
            <textarea name="description" id="description" placeholder="Beskriv produkten i detalj..." required></textarea>
        </div>

        <div>
            <label for="category"><strong>Kategori:</strong></label><br>
            <select name="category" id="category" required style="width: 100%;">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label for="starting_bid"><strong>Startbud (kr):</strong></label><br>
                <input name="starting_bid" id="starting_bid" type="number" step="1" min="1"
                       placeholder="100" required style="width: 100%;">
            </div>

            <div style="flex: 1;">
                <label for="end_datetime"><strong>Slutdatum och tid:</strong></label><br>
                <input name="end_datetime" id="end_datetime" type="datetime-local" required style="width: 100%;">
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-success">✅ Skapa auktion</button>
            <a href="/" class="btn">❌ Avbryt</a>
        </div>
    </form>
</div>
{% endblock %}
